name: Release

# Tag-driven only. The previous workflow also ran on every push to the default
# branch, which — combined with Dependabot auto-merge — was an unattended path
# from a dependency bump to a published binary.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag is the source of truth for the version. Artifact names interpolate
  # ${version} from package.json, so a mismatch ships misnamed files — which is
  # exactly what happened when v1.0.11 released assets named 1.0.0.
  verify:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare package.json to the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

  release:
    name: Build ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in package.json, so CI cannot
      # drift from local. Pinning 9 here meant pnpm-workspace.yaml settings
      # were silently ignored, and native modules were compiled from source.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check, lint and test
        run: |
          pnpm tsc
          pnpm lint
          pnpm lint:strict
          pnpm test

      # electron-builder packages whatever is already in dist/ and
      # dist-electron/; it does not run Vite itself. Skipping this step
      # produced an app.asar with no entry file.
      - name: Build the renderer and the Electron bundles
        run: pnpm exec vite build

      - name: Package and publish
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Releases are deliberately unsigned; users confirm the OS prompt
          # once, as documented in the README. Do not set CSC_LINK here even to
          # an empty value: electron-builder treats a defined-but-empty
          # CSC_LINK as a certificate path and fails resolving it.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The check that matters: does the built binary actually run? An artifact
      # existing proves nothing about whether its native module loads.
      - name: Start a virtual display
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Smoke-test the packaged app
        run: node scripts/smoke-packaged.cjs

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-output-${{ matrix.os }}
          path: release/
          retention-days: 5
